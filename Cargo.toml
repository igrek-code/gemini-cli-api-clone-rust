[package]
name = "gemini-api"
version = "0.1.0"
edition = "2021"
description = "Local OpenAI-compatible API backed by your own Google account (mimics Gemini CLI)"
license = "MIT"

[dependencies]
axum = { version = "0.8", features = ["json"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"
async-stream = "0.3"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls-webpki-roots",
    "stream",
    "gzip",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
dirs = "6"
rand = "0.9"
sha2 = "0.10"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
webbrowser = "1"

[profile.release]
lto = true
strip = true
codegen-units = 1
opt-level = "s"
